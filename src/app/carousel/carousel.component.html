<div class="carousel">
    <h1>Notes</h1>
    <div class="slides-container">
        <div class="slides" [ngStyle]="{'transform': 'translateX(-' + (currentSlide * (100 / slidesPerPage)) + '%)'}">
            <div *ngFor="let slide of slides; let i = index" class="slide" [ngClass]="{'active': i >= currentSlide && i < currentSlide + slidesPerPage}">
                <h2>{{ slide.name }}</h2>
           
                <p>{{ slide.code }}</p>
                <p>Note :{{slide.note}}</p>
            </div>
        </div>
    </div>
    <button class="prev" (click)="prevSlide()" [disabled]="currentSlide === 0">&#10094;</button>
    <button class="next" (click)="nextSlide()" [disabled]="currentSlide >= slides.length - slidesPerPage">&#10095;</button>
</div>
