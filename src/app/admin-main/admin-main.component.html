<div class="grid-container">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-profile">
        <div class="profile-info">
          <span class="user-name">John Doe</span>
          <span class="user-role">Student</span>
        </div>
      </div>
  
      <ul class="sidebar-list">
        <li class="sidebar-list-item" [class.active]="selectedMenu === ''" (click)="resetToDefaultView()">
          <mat-icon>home</mat-icon>
          <a>Home</a>
        </li>
        <li *ngFor="let item of sidebarItems" class="sidebar-list-item" [class.active]="selectedMenu === item.name" (click)="selectMenu(item.name)">
          <mat-icon>{{ item.icon }}</mat-icon>
          <a>{{ item.name }}</a>
        </li>
        <li class="sidebar-list-item last" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <a>Logout</a>
        </li>
      </ul>
    </aside>
  
    <!-- Main Content -->
    <main class="main-container">
      <div *ngIf="selectedMenu === 'Books'">
        <h2>Books</h2>
        <p>Content related to Books...</p>
      </div>
  
      <div *ngIf="selectedMenu === 'Courses'">
        <h2>Courses</h2>
      </div>
  
      <div *ngIf="selectedMenu === 'Grades'">
        <h2>Grades</h2>
      </div>
  
      <div *ngIf="selectedMenu === 'disponibility'">
        <h2>Disponibility</h2>
      </div>
  
      <div *ngIf="!selectedMenu">
        <h2>Welcome</h2>
        <p>Select a menu to view content</p>
  

  
  

  
     
  </div>
